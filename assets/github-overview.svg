        <g transform="translate(48 334)">
          <circle cx="6" cy="-5" r="6" fill="#F97316" />
          <text x="20" class="language">HTML</text>
          <text x="170" class="percentage">3,7%</text>
        </g>
        <g transform="translate(416 334)">
          <circle cx="6" cy="-5" r="6" fill="#A855F7" />
          <text x="20" class="language">CSS</text>
          <text x="170" class="percentage">3,0%</text>
        </g>
        <g transform="translate(784 334)">
          <circle cx="6" cy="-5" r="6" fill="#64748B" />
          <text x="20" class="language">Outras</text>
          <text x="170" class="percentage">1,3%</text>
        </g>

  <text x="48" y="370" class="footer">Fonte: GitHub REST API · forks e repositórios arquivados não entram na análise de linguagens</text>
  <text x="1152" y="370" class="footer" text-anchor="end">Atualizado em 27 de jul. de 2026</text>
</svg>
