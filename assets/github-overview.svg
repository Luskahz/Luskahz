<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">GitHub de Luskahz em números</title>
  <desc id="description">Métricas de repositórios públicos, atividade, estrelas, seguidores e linguagens utilizadas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16" />
      <stop offset="1" stop-color="#10142A" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94A3B8" stroke-opacity=".045" />
    </pattern>
    <style>
      .eyebrow { fill: #8BE9FD; font: 700 13px ui-sans-serif, system-ui, sans-serif; letter-spacing: 2.8px; }
      .title { fill: #F8FAFC; font: 700 23px ui-sans-serif, system-ui, sans-serif; }
      .metric { fill: #F8FAFC; font: 750 34px ui-sans-serif, system-ui, sans-serif; }
      .metric-label { fill: #94A3B8; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .section { fill: #CBD5E1; font: 650 14px ui-sans-serif, system-ui, sans-serif; }
      .language { fill: #CBD5E1; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
      .percentage { fill: #64748B; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: end; }
      .footer { fill: #64748B; font: 500 11px ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#background)" />
  <rect width="1200" height="390" rx="24" fill="url(#grid)" />
  <rect x=".75" y=".75" width="1198.5" height="388.5" rx="23.25" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="48" y="39" class="eyebrow">GITHUB / VISÃO GERAL</text>
  <text x="48" y="65" class="title">Projetos públicos de @Luskahz</text>
  <circle cx="1138" cy="43" r="7" fill="#34D399" />
  <text x="1122" y="47" class="footer" text-anchor="end">ATUALIZAÇÃO AUTOMÁTICA</text>

  
    <g transform="translate(48 78)">
      <rect width="248" height="108" rx="16" fill="#0B1324" stroke="#24324A" />
      <rect width="4" height="108" rx="2" fill="#22D3EE" />
      <text x="26" y="52" class="metric">29</text>
      <text x="26" y="80" class="metric-label">repositórios públicos</text>
    </g>
    <g transform="translate(324 78)">
      <rect width="248" height="108" rx="16" fill="#0B1324" stroke="#24324A" />
      <rect width="4" height="108" rx="2" fill="#34D399" />
      <text x="26" y="52" class="metric">13</text>
      <text x="26" y="80" class="metric-label">ativos nos últimos 180 dias</text>
    </g>
    <g transform="translate(600 78)">
      <rect width="248" height="108" rx="16" fill="#0B1324" stroke="#24324A" />
      <rect width="4" height="108" rx="2" fill="#FBBF24" />
      <text x="26" y="52" class="metric">9</text>
      <text x="26" y="80" class="metric-label">estrelas recebidas</text>
    </g>
    <g transform="translate(876 78)">
      <rect width="248" height="108" rx="16" fill="#0B1324" stroke="#24324A" />
      <rect width="4" height="108" rx="2" fill="#A78BFA" />
      <text x="26" y="52" class="metric">7</text>
      <text x="26" y="80" class="metric-label">pessoas acompanhando</text>
    </g>

  <text x="48" y="226" class="section">Linguagens nos projetos autorais e ativos</text>
  
    <clipPath id="languageBarClip">
      <rect x="48" y="248" width="1104" height="14" rx="7" />
    </clipPath>
    <g clip-path="url(#languageBarClip)"><rect x="48.00" y="248" width="631.71" height="14" fill="#F89820" /><rect x="679.71" y="248" width="311.94" height="14" fill="#F7DF1E" /><rect x="991.65" y="248" width="71.73" height="14" fill="#3178C6" /><rect x="1063.37" y="248" width="40.91" height="14" fill="#F97316" /><rect x="1104.28" y="248" width="33.22" height="14" fill="#A855F7" /><rect x="1137.51" y="248" width="14.49" height="14" fill="#64748B" /></g>
    
        <g transform="translate(48 300)">
          <circle cx="6" cy="-5" r="6" fill="#F89820" />
          <text x="20" class="language">Java</text>
          <text x="170" class="percentage">57,2%</text>
        </g>
        <g transform="translate(416 300)">
          <circle cx="6" cy="-5" r="6" fill="#F7DF1E" />
          <text x="20" class="language">JavaScript</text>
          <text x="170" class="percentage">28,3%</text>
        </g>
        <g transform="translate(784 300)">
          <circle cx="6" cy="-5" r="6" fill="#3178C6" />
