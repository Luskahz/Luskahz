          <text x="19" class="language">JavaScript</text>
          <text x="172" class="percentage">29,5%</text>
        </g>
        <g transform="translate(784 492)">
          <circle cx="6" cy="-4" r="5" fill="#3178C6" />
          <text x="19" class="language">TypeScript</text>
          <text x="172" class="percentage">6,3%</text>
        </g>
        <g transform="translate(48 520)">
          <circle cx="6" cy="-4" r="5" fill="#F97316" />
          <text x="19" class="language">HTML</text>
          <text x="172" class="percentage">3,8%</text>
