<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">Luskahz Dev Arcade</title>
  <desc id="description">Banner em estilo arcade convidando para jogar desafios de Java, JavaScript e SQL.</desc>

  <defs>
    <pattern id="pixels" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#22D3EE" fill-opacity=".11" />
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B12" />
      <stop offset=".55" stop-color="#071521" />
      <stop offset="1" stop-color="#101127" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset=".55" stop-color="#34D399" />
      <stop offset="1" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#background)" />
  <rect width="1200" height="220" rx="18" fill="url(#pixels)" />
  <rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#1E3A4A" stroke-width="2" />

  <g fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="square" opacity=".55">
    <path d="M70 70H46V150H70M91 94H115V126H91" />
    <path d="M1130 70H1154V150H1130M1109 94H1085V126H1109" />
  </g>

  <g text-anchor="middle">
    <text x="600" y="54" fill="#64748B" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="12" letter-spacing="4">LUSKAHZ PRESENTS</text>
    <text x="600" y="115" fill="url(#titleGradient)" filter="url(#glow)" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="48" font-weight="800" letter-spacing="3">DEV ARCADE</text>
    <text x="600" y="148" fill="#94A3B8" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" letter-spacing="2">BUG HUNT · OUTPUT QUEST · SQL ARENA</text>
    <text x="600" y="188" fill="#F8FAFC" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="14" font-weight="700">
      [ PRESS START ]
      <animate attributeName="opacity" values="1;.28;1" dur="1.2s" repeatCount="indefinite" />
    </text>
  </g>

  <g fill="#34D399">
    <rect x="174" y="52" width="8" height="8" />
    <rect x="190" y="52" width="8" height="8" />
    <rect x="166" y="60" width="40" height="8" />
    <rect x="174" y="68" width="8" height="8" />
    <rect x="190" y="68" width="8" height="8" />
  </g>
  <g fill="#FBBF24">
    <rect x="1002" y="148" width="8" height="8" />
    <rect x="1018" y="148" width="8" height="8" />
    <rect x="994" y="156" width="40" height="8" />
    <rect x="1002" y="164" width="8" height="8" />
    <rect x="1018" y="164" width="8" height="8" />
  </g>
</svg>
