<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Carrossel animado de projetos</title>
  <desc id="description">Apresentação alternada dos projetos LogImaruí, Jeep Club API e Dev Arcade.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38BDF8" stroke-opacity=".045" />
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019" />
      <stop offset="1" stop-color="#0A121E" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <style>
      .mono { font-family: DejaVu Sans Mono, Courier New, monospace; }
      .sans { font-family: DejaVu Sans, Arial, sans-serif; }
      .label { fill: #64748B; font-size: 11px; letter-spacing: 2px; }
      .body { fill: #94A3B8; font-size: 15px; }
      .chip { fill: #CBD5E1; font-size: 11px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)" />
  <rect width="1200" height="360" rx="18" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#1E3A4A" stroke-width="2" />
  <path d="M1 50H1199" stroke="#1E3A4A" />

  <g class="mono">
    <text x="38" y="31" fill="#22D3EE" font-size="12">~/projects</text>
    <text x="1110" y="31" text-anchor="end" fill="#64748B" font-size="10">AUTOPLAY · 6S</text>
    <circle cx="1132" cy="27" r="4" fill="#34D399" />
    <circle cx="1148" cy="27" r="4" fill="#334155" />
    <circle cx="1164" cy="27" r="4" fill="#334155" />
  </g>

  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.30;0.333;0.633;0.666;0.966;1" dur="18s" repeatCount="indefinite" />
    <g transform="translate(48 82)">
      <text class="mono label">01 / FLAGSHIP</text>
      <text y="52" class="sans" fill="#F8FAFC" font-size="38" font-weight="750">LogImaruí</text>
      <text y="87" class="sans body">Operação logística transformada em produto.</text>
      <text y="114" class="sans body">Web, API central e cliente mobile trabalhando no mesmo domínio.</text>

      <g transform="translate(0 146)" class="sans">
        <rect width="88" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="44" y="20" text-anchor="middle" class="chip">Next.js</text>
        <rect x="100" width="82" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="141" y="20" text-anchor="middle" class="chip">Java</text>
        <rect x="194" width="116" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="252" y="20" text-anchor="middle" class="chip">Spring Boot</text>
        <rect x="322" width="82" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="363" y="20" text-anchor="middle" class="chip">MySQL</text>
      </g>

      <text y="226" class="mono" fill="#34D399" font-size="12">STATUS: ACTIVE DEVELOPMENT</text>
    </g>

    <g transform="translate(700 82)" class="mono">
      <rect width="442" height="222" rx="12" fill="#07131C" stroke="#1E3A4A" />
      <text x="24" y="34" class="label">SYSTEM MAP</text>
      <g transform="translate(26 65)">
        <rect width="104" height="54" rx="8" fill="#0B1A24" stroke="#22D3EE" />
        <text x="52" y="25" text-anchor="middle" fill="#F8FAFC" font-size="12">WEB</text>
        <text x="52" y="42" text-anchor="middle" fill="#64748B" font-size="9">NEXT.JS</text>
        <path d="M130 27H168" stroke="#334155" stroke-width="2" />
        <path d="M160 20L168 27L160 34" fill="none" stroke="#334155" stroke-width="2" />
        <rect x="168" width="104" height="54" rx="8" fill="#0B1A24" stroke="#34D399" />
        <text x="220" y="25" text-anchor="middle" fill="#F8FAFC" font-size="12">CORE</text>
        <text x="220" y="42" text-anchor="middle" fill="#64748B" font-size="9">JAVA API</text>
        <path d="M272 27H310" stroke="#334155" stroke-width="2" />
        <path d="M302 20L310 27L302 34" fill="none" stroke="#334155" stroke-width="2" />
        <rect x="310" width="80" height="54" rx="8" fill="#0B1A24" stroke="#FBBF24" />
        <text x="350" y="25" text-anchor="middle" fill="#F8FAFC" font-size="12">DB</text>
        <text x="350" y="42" text-anchor="middle" fill="#64748B" font-size="9">MYSQL</text>
      </g>
      <rect x="26" y="151" width="390" height="42" rx="8" fill="#0A1720" />
      <text x="42" y="176" fill="#7DD3FC" font-size="11">domain:</text>
      <text x="103" y="176" fill="#CBD5E1" font-size="11">routes · delivery · indicators · automation</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.30;0.333;0.633;0.666;0.966;1" dur="18s" repeatCount="indefinite" />
    <g transform="translate(48 82)">
      <text class="mono label">02 / BACKEND</text>
      <text y="52" class="sans" fill="#F8FAFC" font-size="38" font-weight="750">Jeep Club API</text>
      <text y="87" class="sans body">Backend modular para associados, dependentes e eventos.</text>
      <text y="114" class="sans body">Autenticação JWT, permissões e domínio separado por responsabilidades.</text>

      <g transform="translate(0 146)" class="sans">
        <rect width="82" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="41" y="20" text-anchor="middle" class="chip">Java 21</text>
        <rect x="94" width="116" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="152" y="20" text-anchor="middle" class="chip">Spring Boot</text>
        <rect x="222" width="68" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="256" y="20" text-anchor="middle" class="chip">JWT</text>
        <rect x="302" width="68" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="336" y="20" text-anchor="middle" class="chip">JPA</text>
      </g>

      <text y="226" class="mono" fill="#A78BFA" font-size="12">STYLE: MODULAR / PORTS &amp; ADAPTERS</text>
    </g>

    <g transform="translate(700 82)" class="mono">
      <rect width="442" height="222" rx="12" fill="#07131C" stroke="#1E3A4A" />
      <text x="24" y="34" class="label">MODULE SELECT</text>
      <g transform="translate(26 60)" fill="#0B1A24" stroke="#1E3A4A">
        <rect width="180" height="42" rx="7" />
        <rect x="206" width="180" height="42" rx="7" />
        <rect y="56" width="180" height="42" rx="7" />
        <rect x="206" y="56" width="180" height="42" rx="7" />
        <rect y="112" width="180" height="42" rx="7" />
        <rect x="206" y="112" width="180" height="42" rx="7" />
      </g>
      <g transform="translate(26 60)" fill="#CBD5E1" font-size="11">
        <text x="16" y="26">authentication</text>
        <text x="222" y="26">authorization</text>
        <text x="16" y="82">members</text>
        <text x="222" y="82">dependents</text>
        <text x="16" y="138">medical-profile</text>
        <text x="222" y="138">events</text>
      </g>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.30;0.333;0.633;0.666;0.966;1" dur="18s" repeatCount="indefinite" />
    <g transform="translate(48 82)">
      <text class="mono label">03 / PLAYGROUND</text>
      <text y="52" class="sans" fill="#F8FAFC" font-size="38" font-weight="750">Dev Arcade</text>
      <text y="87" class="sans body">Um perfil de desenvolvedor que também tem botão de jogar.</text>
      <text y="114" class="sans body">Desafios curtos de Java, JavaScript e SQL direto no navegador.</text>

      <g transform="translate(0 146)" class="sans">
        <rect width="72" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="36" y="20" text-anchor="middle" class="chip">HTML</text>
        <rect x="84" width="68" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="118" y="20" text-anchor="middle" class="chip">CSS</text>
        <rect x="164" width="106" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="217" y="20" text-anchor="middle" class="chip">JavaScript</text>
        <rect x="282" width="96" height="30" rx="7" fill="#0C1C27" stroke="#1E3A4A" />
        <text x="330" y="20" text-anchor="middle" class="chip">No deps</text>
      </g>

      <text y="226" class="mono" fill="#FBBF24" font-size="12">DEPLOY: GITHUB PAGES / FREE</text>
    </g>

    <g transform="translate(700 82)" class="mono">
      <rect width="442" height="222" rx="12" fill="#07131C" stroke="#1E3A4A" />
      <text x="24" y="34" class="label">SELECT MODE</text>
      <g transform="translate(26 60)">
        <rect width="390" height="38" rx="6" fill="#0B1A24" stroke="#22D3EE" />
        <text x="18" y="24" fill="#22D3EE" font-size="11">01</text>
        <text x="58" y="24" fill="#F8FAFC" font-size="11">BUG HUNT</text>
        <text x="364" y="24" text-anchor="end" fill="#64748B" font-size="9">JAVA</text>
        <rect y="50" width="390" height="38" rx="6" fill="#0B1A24" stroke="#34D399" />
        <text x="18" y="74" fill="#34D399" font-size="11">02</text>
        <text x="58" y="74" fill="#F8FAFC" font-size="11">OUTPUT QUEST</text>
        <text x="364" y="74" text-anchor="end" fill="#64748B" font-size="9">JAVASCRIPT</text>
        <rect y="100" width="390" height="38" rx="6" fill="#0B1A24" stroke="#FBBF24" />
        <text x="18" y="124" fill="#FBBF24" font-size="11">03</text>
        <text x="58" y="124" fill="#F8FAFC" font-size="11">SQL ARENA</text>
        <text x="364" y="124" text-anchor="end" fill="#64748B" font-size="9">MYSQL</text>
      </g>
    </g>
  </g>

  <rect x="48" y="330" width="1104" height="3" rx="1.5" fill="#132835" />
  <rect x="48" y="330" width="368" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="x" values="48;48;416;416;784;784;48" keyTimes="0;0.30;0.333;0.633;0.666;0.966;1" dur="18s" repeatCount="indefinite" />
  </rect>
</svg>
