<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Terminal de apresentação de Lucas Alves</title>
  <desc id="description">Interface de terminal com informações sobre Lucas, seu foco em backend e seus projetos atuais.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7DD3FC" stroke-opacity=".055" />
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08111A" />
      <stop offset="1" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="18" fill="url(#screen)" />
  <rect width="1200" height="480" rx="18" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="478" rx="17" fill="none" stroke="#1E3A4A" stroke-width="2" />

  <g font-family="DejaVu Sans Mono, Courier New, monospace">
    <rect x="1" y="1" width="1198" height="48" rx="17" fill="#0B1621" />
    <path d="M1 48H1199" stroke="#1E3A4A" />
    <circle cx="24" cy="24" r="5" fill="#FB7185" />
    <circle cx="44" cy="24" r="5" fill="#FBBF24" />
    <circle cx="64" cy="24" r="5" fill="#34D399" />
    <text x="600" y="29" text-anchor="middle" fill="#64748B" font-size="12">lucas@caragua: ~/profile</text>
    <text x="1166" y="29" text-anchor="end" fill="#22D3EE" font-size="11">ONLINE</text>

    <g transform="translate(54 82)">
      <text y="0" fill="#34D399" font-size="15">lucas@caragua</text>
      <text x="126" y="0" fill="#64748B" font-size="15">:</text>
      <text x="138" y="0" fill="#7DD3FC" font-size="15">~</text>
      <text x="150" y="0" fill="#E2E8F0" font-size="15">$ whoami</text>

      <text y="48" fill="#F8FAFC" font-size="41" font-weight="700">Lucas Alves</text>
      <text y="78" fill="#94A3B8" font-size="15">backend developer · ADS @ IFSP · logística × dados × software</text>

      <text y="132" fill="#34D399" font-size="15">lucas@caragua</text>
      <text x="126" y="132" fill="#64748B" font-size="15">:</text>
      <text x="138" y="132" fill="#7DD3FC" font-size="15">~</text>
      <text x="150" y="132" fill="#E2E8F0" font-size="15">$ git status --short</text>

      <text y="169" fill="#FBBF24" font-size="14">M</text>
      <text x="28" y="169" fill="#CBD5E1" font-size="14">logimarui/architecture</text>
      <text y="199" fill="#22D3EE" font-size="14">A</text>
      <text x="28" y="199" fill="#CBD5E1" font-size="14">jeep-club/modules</text>
      <text y="229" fill="#A78BFA" font-size="14">?</text>
      <text x="28" y="229" fill="#CBD5E1" font-size="14">next_problem_to_solve</text>

      <text y="283" fill="#34D399" font-size="15">lucas@caragua</text>
      <text x="126" y="283" fill="#64748B" font-size="15">:</text>
      <text x="138" y="283" fill="#7DD3FC" font-size="15">~</text>
      <text x="150" y="283" fill="#E2E8F0" font-size="15">$</text>
      <rect x="165" y="268" width="9" height="20" fill="#22D3EE">
        <animate attributeName="opacity" values="1;.12;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <g transform="translate(760 76)">
      <rect width="384" height="356" rx="12" fill="#071019" stroke="#1E3A4A" />
      <rect x="18" y="18" width="348" height="320" rx="8" fill="#09141E" stroke="#16303D" />

      <text x="38" y="48" fill="#64748B" font-size="11" letter-spacing="2">PLAYER PROFILE</text>
      <path d="M38 64H346" stroke="url(#cyanLine)" stroke-width="2" />

      <g transform="translate(38 84)">
        <rect width="92" height="92" rx="6" fill="#0A1A24" stroke="#22D3EE" stroke-opacity=".6" />
        <g fill="#22D3EE" filter="url(#glow)">
          <rect x="20" y="17" width="10" height="58" />
          <rect x="30" y="65" width="34" height="10" />
          <rect x="55" y="17" width="10" height="58" />
          <rect x="45" y="17" width="20" height="10" />
          <rect x="45" y="42" width="20" height="10" />
        </g>
      </g>

      <text x="154" y="101" fill="#64748B" font-size="10" letter-spacing="1.5">CLASS</text>
      <text x="154" y="123" fill="#F8FAFC" font-size="16" font-weight="700">BACKEND FIRST</text>
      <text x="154" y="153" fill="#64748B" font-size="10" letter-spacing="1.5">MAIN STACK</text>
      <text x="154" y="175" fill="#F8FAFC" font-size="14">JAVA / SPRING / NEXT</text>

      <text x="38" y="211" fill="#64748B" font-size="10" letter-spacing="1.5">CURRENT QUEST</text>

      <text x="38" y="234" fill="#F8FAFC" font-size="12">FINISH ADS</text>
      <!-- ADS_DAYS -->
      <text x="346" y="234" text-anchor="end" fill="#94A3B8" font-size="10">155 DAYS LEFT</text>
      <!-- /ADS_DAYS -->
      <rect x="38" y="245" width="308" height="7" rx="3.5" fill="#142733" />
      <rect id="adsProgress" x="38" y="245" width="255.71" height="7" rx="3.5" fill="url(#cyanLine)" />
      <!-- ADS_PERCENT -->
      <text x="346" y="264" text-anchor="end" fill="#64748B" font-size="9">83.0% COMPLETE</text>
      <!-- /ADS_PERCENT -->

      <text x="38" y="288" fill="#F8FAFC" font-size="12">SHIP LOGIMARUÍ</text>
      <text x="346" y="288" text-anchor="end" fill="#94A3B8" font-size="10">15.0% COMPLETE</text>
      <rect x="38" y="299" width="308" height="7" rx="3.5" fill="#142733" />
      <rect x="38" y="299" width="46.2" height="7" rx="3.5" fill="url(#cyanLine)" />
      <text x="346" y="318" text-anchor="end" fill="#64748B" font-size="9">KEEP BUILDING</text>
    </g>

    <text x="54" y="457" fill="#475569" font-size="10">[ README MODE ]</text>
    <text x="1146" y="457" text-anchor="end" fill="#475569" font-size="10">PUBLIC BUILD · NO FAKE METRICS</text>
  </g>
</svg>
