name: Atualizar painel do perfil

on:
  workflow_dispatch:
  schedule:
    # 03:37 UTC corresponde a 00:37 em America/Sao_Paulo.
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar testes
        run: npm test

      - name: Gerar painel
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Luskahz

      - name: Publicar somente quando houver mudança
        run: |
          if git diff --quiet -- assets/activity-dashboard.svg assets/commit-pulse.svg; then
            echo "Métricas já estão atualizadas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/activity-dashboard.svg assets/commit-pulse.svg
          git commit -m "chore: update profile metrics"
          git push
